name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Write secrets to .env
        run: |
          cat > ~/Documents/portfolio-website/.env <<EOF
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          MEMBER_TOKEN=${{ secrets.MEMBER_TOKEN }}
          EOF

      - name: Deploy
        run: |
          cd ~/Documents/portfolio-website
          git pull origin main
          docker compose build --build-arg CACHE_BUST=$(git rev-parse HEAD)
          docker compose up -d --force-recreate
