name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Write secrets to .env
        run: |
          cat > ~/Documents/portfolio-website/.env <<EOF
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          ICS_URL=${{ secrets.ICS_URL }}
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN=${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_ALBUM_ID=${{ secrets.GOOGLE_ALBUM_ID }}
          EOF

      - name: Deploy
        run: |
          cd ~/Documents/portfolio-website
          git pull origin main
          docker compose build --build-arg CACHE_BUST=$(git rev-parse HEAD)
          docker compose up -d --force-recreate
